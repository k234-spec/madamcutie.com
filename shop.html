<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop — Madamcutie</title>
<meta name="description" content="Madamcutie — Effortless style for modern queens. Luxury Indian fashion, curated for you.">
<link rel="icon" type="image/png" href="assets/madamcutie-logo.png">
<link rel="apple-touch-icon" href="assets/madamcutie-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="shop-page " data-view="shop">

<header id="shopHeader">
  <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav"><span></span><span></span></button>
  <a aria-label='Madamcutie — home' class='brand' href='/'>
    <svg id="brandLogo" viewBox="0 0 1600 1351" role="img" aria-label="Madamcutie"></svg>
  </a>
  <nav class="sh-nav" aria-label="Primary">
    <span><a href='/#top'>Home</a></span>
    <span><a data-cat='women' href='/category?c=women'>Women</a></span>
    <span><a data-cat='kalakaari' href='/category?c=kalakaari'>Kalakaari</a></span>
    <span><a href='/shop?c=women&amp;s=sarees'>New Arrivals</a></span>
    <span><a href='/#best'>Best Sellers</a></span>
    <span><a href='/#storyEd'>Our Story</a></span>
  </nav>
  <div class="sh-utils">
    <a aria-label='Search' class='util' href='/shop?c=women'><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg></a>
    <a aria-label='Wishlist' class='util' href='/track'><svg viewBox="0 0 24 24"><path d="M12 20.2 5 13.4a4.6 4.6 0 0 1 0-6.6 4.7 4.7 0 0 1 6.6 0l.4.4.4-.4a4.7 4.7 0 0 1 6.6 0 4.6 4.6 0 0 1 0 6.6Z"/></svg><span class="sh-badge" data-badge="wish">0</span></a>
    <a aria-label='Bag' class='util' href='/cart'><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l-.9 11a1.6 1.6 0 0 1-1.6 1.5H8a1.6 1.6 0 0 1-1.6-1.5Z"/><path d="M8.8 8.2V7a3.2 3.2 0 0 1 6.4 0v1.2"/></svg><span class="sh-badge" data-badge="cart">0</span></a>
  </div>
</header>

<div id="mobileNav" aria-hidden="true">
  <div class="mn-top">
    <button class="mn-back" id="mnBack" aria-label="Back one level"><svg viewBox="0 0 20 14"><path d="M19 7H2M8 1 1.5 7 8 13"/></svg></button>
    <p class="mn-title" id="mnTitle"><svg class="mn-emblem" id="menuEmblem" viewBox="380 30 840 900" aria-hidden="true"></svg></p>
    <button class="mn-close" id="mnClose" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="mn-stage" id="mnStage"></div>
  <div class="mn-foot">
    <a class='mn-acct' href='/track'>My Orders</a>
    <p>Effortless Style for Modern Queens</p>
  </div>
</div>
<main>
  <div class="shop-wrap">
    <nav class="sh-bc" aria-label="Breadcrumb">
      <a href='/'>Home</a><i>·</i><a id="bcCat" href="#">Women</a><i>·</i><span id="bcSub" aria-current="page"></span>
    </nav>
  </div>
  <section class="sh-band shop-wrap">
    <img id="shBandImg" alt="">
    <div class="sh-band-copy">
      <h1 class="sh-h1" id="shTitle"></h1>
      <p class="sh-lede" id="shLine"></p>
    </div>
  </section>

  <div class="shop-wrap sh-layout">
    <aside class="sh-filters" id="shFilters" aria-label="Filters">
      <div class="f-head"><h3>Filters</h3><button type="button" id="shClear">Clear all</button></div>
      <div class="f-grp"><h4>Fabric</h4><div id="fFabric"></div></div>
      <div class="f-grp"><h4>Price Range</h4>
        <input type="range" class="f-range" id="fPrice" min="0" max="50000" step="500" aria-label="Maximum price">
        <p class="f-vals"><span id="fPriceLo">₹ 0</span><span id="fPriceHi">₹ 50,000</span></p>
      </div>
      <div class="f-grp"><h4>Colour</h4><div class="f-sws" id="fColor"></div></div>
      <button type="button" class="sh-cta sh-filter-done" id="shFilterDone"><span class="sh-cta-l">Show results</span></button>
    </aside>

    <section>
      <div class="sh-bar">
        <p class="sh-count" id="shCount"></p>
        <button type="button" class="sh-ghost sh-filter-btn" id="shFilterBtn" aria-expanded="false" aria-controls="shFilters">Filters</button>
        <span class="sh-sortwrap">
          <label for="shSort">Sort by</label>
          <select id="shSort">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="rating">Top rated</option>
          </select>
          <svg viewBox="0 0 10 6"><path d="m1 1 4 4 4-4"/></svg>
        </span>
      </div>
      <div class="sh-grid" id="shGrid"></div>
    </section>
  </div>
</main>

<footer class="sh-foot">
  <span class="sh-foot-b">
    <svg id="footEmblemS" viewBox="380 30 840 900" aria-hidden="true"></svg>
    <p>Madamcutie</p>
  </span>
  <p>Tradition Lives Beautifully</p>
</footer>

<script src="js/emblem-data.js?v=10"></script>
<script src="js/shop-data.js?v=2"></script>
<script src="js/shop.js?v=6"></script>
</body>
